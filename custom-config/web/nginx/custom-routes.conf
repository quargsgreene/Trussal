# Explicitly serve and protect Trussal custom javascript modules
location /css/src/ {
    alias /usr/share/jitsi-meet/css/src/;
    include /etc/nginx/mime.types;
    types {
        application/javascript js;
    }
    default_type application/javascript;
    add_header Content-Type application/javascript;
    add_header Access-Control-Allow-Origin *;
    
    # Break out of Jitsi's internal HTML catch-all loops
    try_files $uri =404;
    access_log off;
}
