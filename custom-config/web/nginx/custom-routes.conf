# Explicitly serve and protect Trussal custom javascript modules.
# `^~` so this beats meet.conf's regex static allowlist
# (`~ ^/(libs|css|static|…)`) — without it a plain prefix location loses to
# that regex and the headers below (no-cache!) would never be applied.
location ^~ /css/src/ {
    alias /usr/share/jitsi-meet/css/src/;
    include /etc/nginx/mime.types;
    types {
        application/javascript js;
    }
    default_type application/javascript;
    add_header Access-Control-Allow-Origin *;

    # Prevent caching during development — images and other assets in
    # css/src/ (including docs-images/) should update on hard refresh.
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Break out of Jitsi's internal HTML catch-all loops
    try_files $uri =404;
    access_log off;
}

# Strudel's scheduler clock is a SharedWorker the bundle loads as
# `new URL("assets/clockworker-<hash>.js", import.meta.url)` — i.e. from
# /assets/ (custom-config.js copies these files into
# /usr/share/jitsi-meet/assets via jitsi-web/Dockerfile). Jitsi's meet.conf
# static allowlist (libs|css|static|images|fonts|lang|sounds|…) has no
# /assets/ entry, so the request falls through to the SPA tenant-rewrite
# catch-all and is answered with index.html as text/html. Chrome refuses to
# start a SharedWorker served as text/html (X-Content-Type-Options: nosniff),
# so Strudel's NeoCyclist never receives a tick, no pattern is ever queried,
# superdough never triggers — every performer is silent and the aggregator
# mixes silence for the whole room. `^~` so this beats the tenant regex.
location ^~ /assets/ {
    alias /usr/share/jitsi-meet/assets/;
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
    }
    default_type application/javascript;
    add_header Access-Control-Allow-Origin *;

    # Break out of Jitsi's internal HTML catch-all loops
    try_files $uri =404;
    access_log off;
}

# The standalone Documentation and About pages (generated by build-pages.mjs
# into dist/ and copied to /usr/share/jitsi-meet/ by the jitsi-web image /
# deploy:local). meet.conf's bare-`/<segment>` room location rewrites any
# single path segment to the SPA shell and the app would then try to join a
# room called "documentation" — an exact match beats that regex, so these
# exact URLs serve the two static pages instead. The URIs carry no extension,
# so the content type has to be set explicitly (nginx derives it from the
# request URI, not the aliased file).
location = /documentation {
    alias /usr/share/jitsi-meet/documentation.html;
    default_type text/html;
}
location = /about {
    alias /usr/share/jitsi-meet/about.html;
    default_type text/html;
}

# Tolerate a trailing slash: without these, /documentation/ falls into the
# tenant-subdomain catch-all and is rewritten to the lobby.
location = /documentation/ { return 301 /documentation; }
location = /about/ { return 301 /about; }
