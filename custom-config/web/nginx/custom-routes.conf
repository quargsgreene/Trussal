# Explicitly serve and protect Trussal custom javascript modules
location /css/src/ {
    alias /usr/share/jitsi-meet/css/src/;
    include /etc/nginx/mime.types;
    types {
        application/javascript js;
    }
    default_type application/javascript;
    add_header Content-Type application/javascript;
    add_header Access-Control-Allow-Origin *;

    # Break out of Jitsi's internal HTML catch-all loops
    try_files $uri =404;
    access_log off;
}

# Strudel's scheduler clock is a SharedWorker the bundle loads as
# `new URL("assets/clockworker-<hash>.js", import.meta.url)` — i.e. from
# /assets/ (custom-config.js copies these files into
# /usr/share/jitsi-meet/assets via jitsi-web/Dockerfile). Jitsi's meet.conf
# static allowlist (libs|css|static|images|fonts|lang|sounds|…) has no
# /assets/ entry, so the request falls through to the SPA tenant-rewrite
# catch-all and is answered with index.html as text/html. Chrome refuses to
# start a SharedWorker served as text/html (X-Content-Type-Options: nosniff),
# so Strudel's NeoCyclist never receives a tick, no pattern is ever queried,
# superdough never triggers — every performer is silent and the aggregator
# mixes silence for the whole room. `^~` so this beats the tenant regex.
location ^~ /assets/ {
    alias /usr/share/jitsi-meet/assets/;
    include /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
    }
    default_type application/javascript;
    add_header Access-Control-Allow-Origin *;

    # Break out of Jitsi's internal HTML catch-all loops
    try_files $uri =404;
    access_log off;
}
