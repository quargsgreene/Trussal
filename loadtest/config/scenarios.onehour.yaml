# One-hour single-SUT campaign (2026-09-01). A trimmed, capacity-fitted
# scenarios file, meant to be passed to run_campaign.sh AND read by the
# LoadTestShape (via SCENARIOS_YAML — see harness/common.py::load_scenarios).
#
# Differences from the canonical config/scenarios.yaml:
#   matrix.profiles   6 -> 3   (p0_lan / p2_lte_typical / p5_edge: clean,
#                               median, worst — the ends plus the middle)
#   matrix.scenarios  drop S2 (needs a bots conductor + Docker on the
#                     generator VM, not provisioned) — keeps S1/S3/S4
#   extra_cells       dropped (the p3 handover overlay)
#   intercell_settle  90s -> 20s
#   S1 steps          capped at 12 concurrent real Chromium — each user is a
#                     headless Chromium subprocess (~300-500 MiB), and .42 has
#                     8 GiB; the manuscript ladder's 32/64/120 would OOM it
#   S3 / S4 humans    12 -> 10 for the same headroom (Hydra on in both)
# Duration is then scaled at launch with STEP_HOLD_SCALE=0.25 (env), which
# only shrinks each step's hold, not the number of load levels — every point
# on every figure's x-axis is still a real, separately-held measurement.
# S2/S5/S6 are kept as complete, valid definitions so the file parses, though
# matrix.scenarios does not run them.

matrix:
  profiles: [p0_lan, p2_lte_typical, p5_edge]
  extra_cells: []
  scenarios: [S1, S3, S4]
  intercell_settle_s: 20

turn_study:
  targets: [sut_explicit, sut_hash]
  profiles: [p2_lte_typical, p3_lte_busy, p4_hspa]
  matched_load: [S5]
  break_find: [S6]
  intercell_settle_s: 90

scenarios:

  S1_steady_join:
    id: S1
    description: >
      Humans join a single room at a fixed arrival rate and stay. Isolates the
      cost of roster size / simulcast / SFU forwarding as N grows. Capped at 12
      (headroom on the single 8 GiB generator; each user is a
      real headless Chromium).
    shape: SteadyJoinShape
    room_mode: single
    user_classes: [HumanParticipantUser, SidecarGhostUser]
    ghost_ratio: 3
    media_profile:
      video_height: 240
      fps: 15
      strudel_on: true
      hydra: false
    steps:
      - {level: 4,   hold_s: 240}
      - {level: 8,   hold_s: 240}
      - {level: 12,  hold_s: 360}
    arrival_rate_per_s: 0.5

  S2_bot_swarm:
    id: S2
    description: >
      Not run in this campaign (matrix.scenarios) — needs a bots conductor on
      the generator VM. Definition kept intact for when that lands.
    shape: BotRampShape
    room_mode: single
    user_classes: [HumanParticipantUser, BotOperatorUser]
    humans: 4
    media_profile: {video_height: 240, fps: 15, strudel_on: true, hydra: true}
    steps:
      - {level: 4,   hold_s: 300}
      - {level: 12,  hold_s: 300}
      - {level: 24,  hold_s: 360}
      - {level: 48,  hold_s: 420}
      - {level: 96,  hold_s: 480}
    spawn_batch: 4
    require_max_bots: 120

  S3_metaprogram_growth:
    id: S3
    description: >
      One editor grows the shared `$ participants` sequence one token at a time
      while a fixed population is present. Measures Yjs fan-out, ring
      rescheduling, nc-active cadence drift as the ring lengthens.
    shape: MetaprogramGrowthShape
    room_mode: single
    user_classes: [HumanParticipantUser, MetaprogramEditorUser]
    humans: 10
    seed_bots: 6
    media_profile: {video_height: 240, fps: 15, strudel_on: true, hydra: true}
    steps:
      - {level: 2,   hold_s: 180}
      - {level: 4,   hold_s: 180}
      - {level: 8,   hold_s: 240}
      - {level: 16,  hold_s: 240}
      - {level: 24,  hold_s: 300}
      - {level: 32,  hold_s: 300}
    directives: "# cycles wcl\n# tempo 110\n# room wcl 2\n# mosaic"
    edit_interval_s: 6

  S4_codevolume_media:
    id: S4
    description: >
      A fixed human population; each performer churns their editor at a rising
      byte budget, cycling through media kinds. Population 24 -> 10 to fit the
      generator's RAM; the independent variable (bytes/update) is unchanged.
    shape: CodeVolumeShape
    room_mode: single
    user_classes: [HumanParticipantUser]
    humans: 10
    media_profile: {video_height: 240, fps: 15, strudel_on: true, hydra: true}
    steps:
      - {level: 200,    hold_s: 240}
      - {level: 1000,   hold_s: 240}
      - {level: 4000,   hold_s: 300}
      - {level: 12000,  hold_s: 300}
      - {level: 32000,  hold_s: 360}
    media_kinds: [plain, samples, images, datapack, hydra, textcycles, csscycles]
    update_interval_s: 4
    datapack_rows_per_level: [8, 32, 64, 64, 64]

  S5_churn:
    id: S5
    description: Layout-C matched-pair study — not run here (single SUT).
    shape: ChurnShape
    room_mode: single
    user_classes: [HumanParticipantUser, ChurnUser, SidecarGhostUser]
    humans: 16
    seed_bots: 12
    ghost_ratio: 4
    media_profile: {video_height: 240, fps: 15, strudel_on: true, hydra: false}
    steps:
      - {level: 2,   hold_s: 240}
      - {level: 6,   hold_s: 240}
      - {level: 12,  hold_s: 300}
      - {level: 24,  hold_s: 300}
      - {level: 48,  hold_s: 360}
    churn_pool: 16
    involuntary_frac: 0.35
    rejoin_delay_s: [3, 12]
    program_directives: "# cycles wcl\n# tempo 110"

  S6_breakfind:
    id: S6
    description: Layout-C break-find study — not run here (single SUT).
    shape: BreakFindShape
    room_mode: single
    user_classes: [HumanParticipantUser, ChurnUser, SidecarGhostUser]
    seed_bots: 12
    ghost_ratio: 4
    media_profile: {video_height: 240, fps: 15, strudel_on: true, hydra: false}
    ramp: {start: 8, increment: 8, max: 200, dwell_s: 150}
    background_churn_per_min: 8
    program_directives: "# cycles wcl\n# tempo 110"
    break_conditions:
      dropout_hazard_per_part_min: 0.5
      nc_gap_multiple_of_ideal: 3.0
      aggregator_cpu_pct: 90
      jvb_cpu_pct: 92
      join_success_rate: 0.5
      sustained_s: 30
      poll_s: 5

media_defaults:
  join_timeout_s: 45
  stats_interval_s: 2
  graceful_leave: true
