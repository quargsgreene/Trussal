<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Trussal</title>
    <!-- Base shell styles only; feature CSS is imported by the bundle. The
         __ASSET_VERSION__ token is rewritten per-build for cache-busting. -->
    <link rel="stylesheet" href="/page.css?v=__ASSET_VERSION__" />
    <link rel="stylesheet" id="trussal-styles" href="/custom-config.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <!-- The deployment's own config (hosts, BOSH/websocket service URL) as plain
         data. It is not the Jitsi app: nothing here renders or joins a meeting. -->
    <script src="/config.js"></script>
    <script src="/custom-config.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
