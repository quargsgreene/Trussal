# Reverse-proxy the latency-instrument WebSocket to the `latency` sidecar
# (ws server on :8081). Without this, /ws is swallowed by Jitsi's room-name
# catch-all in meet.conf and answered with index.html, so the WS upgrade fails.
# Pulled in by meet.conf's `include /config/nginx-custom/*.conf`.
location = /ws {
    tcp_nodelay on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Variable upstream forces request-time DNS via the Docker resolver, so nginx
    # still starts when the sidecar isn't up yet (web has no depends_on latency).
    set $latency_upstream "latency:8081";
    proxy_pass http://$latency_upstream;

    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
