<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Trussal Latency Composer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <h1>Latency Composer</h1>

    <div class="stats">
      <div>Room: <span id="roomLabel"></span></div>
    </div>

    <label>
      Base delay (ms):
      <input id="baseDelay" type="number" value="150" />
    </label>
    <label>
      RTT scale:
      <input id="rttScale" type="number" step="0.1" value="0.5" />
    </label>
    <label>
      Use RTT?
      <input id="useRtt" type="checkbox" checked />
    </label>

    <button id="startBtn">Start pattern</button>
    <button id="stopBtn">Stop pattern</button>

    <pre id="log"></pre>
  </div>

  <script src="composer.js"></script>
</body>
</html>
