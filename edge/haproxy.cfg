# Trussal edge — consistent-hash room -> shard load balancer.
#
# Fronts N full Jitsi stacks ("shards", one per rack machine). Cloudflare stays
# in front of this; HAProxy is the plain-HTTP LAN origin (decision 3), so it
# binds :80 and trusts the CF edge for TLS. Every surface of a given room must
# land on ONE shard, because that shard's `latency` sidecar holds all of the
# room's roster/CRDT/turn state in one in-memory process with no shared store.
#
# Room key: the Trussal room is the LAST path segment of the URL
# (getRoomNameFromUrl / AggregatorBot#roomAndProto). The SPA fetches `/<room>`;
# the sidecar is hit as `/ws?room=<room>` and `/o2?room=<room>`. XMPP
# (`/http-bind`, `/xmpp-websocket`) carries the room in the body, not the URL —
# those ride a per-client stick-table + `SHARD` cookie seeded by the SPA hit
# (decision 5). colibri-ws is keyed by the bridge id, which is shard-unique.
#
# src/deploy/room-shard.js models this same rendezvous mapping offline (for the
# conductor's pre-compute and loadtest/figures/fig11). HAProxy is the runtime
# authority; a small divergence in tie handling is harmless.
#
# Add / drain a shard: edit the `server` lines in every backend below, keep the
# names stable, `haproxy -c -f` then reload. `hash-type consistent` re-homes
# only ~1/N of rooms on an add and only the drained shard's rooms on a remove.

global
    log stdout format raw local0 info
    maxconn 20000
    nbthread 4

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    timeout http-request 15s
    timeout http-keep-alive 10s
    retries 2

# ---------------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------------
frontend fe_edge
    bind :80

    # Cloudflare terminates TLS; take the visitor IP from CF so the stick-table
    # is per-user, not per-CF-PoP.
    http-request set-var(txn.client_ip) req.hdr(CF-Connecting-IP)
    http-request set-var(txn.client_ip) src if !{ req.hdr(CF-Connecting-IP) -m found }

    # ---- classify the request ---------------------------------------------
    acl has_room_param    urlp(room) -m found
    acl want_jamulus      path /jamulus-audio
    acl want_colibri      path_beg /colibri-ws/ /colibri-relay-ws/
    acl want_xmpp         path_beg /http-bind /xmpp-websocket
    acl is_roomless_path  path_beg /libs/ /css/ /static/ /images/ /fonts/ /lang/ /sounds/ /connection_optimization/ /.well-known/ /transcripts/ /http-bind /xmpp-websocket /ws /o2 /jamulus-audio /colibri-ws/ /colibri-relay-ws/ /config.js /interface_config.js /external_api.js /_api/

    # ---- derive the room key --------------------------------------------------
    # explicit ?room= wins (the sidecar entrypoints — bots & aggregator use
    # these and never fetch `/<room>`, so it is their only signal); otherwise
    # the last path segment, unless this is a known non-room path.
    http-request set-var(txn.room) urlp(room),lower if has_room_param
    http-request set-var(txn.room) path,field(-1,/),lower if !has_room_param !is_roomless_path
    acl have_room var(txn.room) -m found

    use_backend jamulus_relays  if want_jamulus
    use_backend jitsi_colibri   if want_colibri
    use_backend jitsi_xmpp      if want_xmpp
    use_backend jitsi_room      if have_room
    default_backend jitsi_spa

# ---------------------------------------------------------------------------
# Backends — EDIT THE `server` LINES for your rack. Names must stay stable.
# `s1`, `s2` = the two Dell shards. Add `s3` (the AMD) later, everywhere.
# ---------------------------------------------------------------------------

# Room-bearing requests (SPA `/<room>`, `/ws?room=`, `/o2?room=`): hash the room
# onto the ring. This is the mapping src/deploy/room-shard.js mirrors.
backend jitsi_room
    balance hdr(x-trussal-room)
    hash-type consistent sdbm avalanche
    http-request set-header x-trussal-room %[var(txn.room)]
    option httpchk
    http-check send meth GET uri /about/health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 maxconn 8000
    server s1 10.20.0.11:80 check
    server s2 10.20.0.21:80 check
    # server s3 10.20.0.31:80 check

# SPA HTML + static + `/`: keep a browser on one shard for the life of its
# session and hand it a `SHARD` cookie the XMPP paths reuse. Pins the `?v=`
# cache-bust in index.html to the shard whose assets answer for it.
backend jitsi_spa
    balance roundrobin
    cookie SHARD insert indirect nocache httponly
    stick-table type string len 64 size 200k expire 8h
    stick on var(txn.client_ip)
    option httpchk
    http-check send meth GET uri /about/health
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server s1 10.20.0.11:80 check cookie s1
    server s2 10.20.0.21:80 check cookie s2
    # server s3 10.20.0.31:80 check cookie s3

# BOSH / xmpp-websocket: room is in the body, so follow the SPA's decision — the
# `SHARD` cookie first, the shared per-IP table behind it.
backend jitsi_xmpp
    balance roundrobin
    stick-table type string len 64 size 200k expire 8h
    stick on var(txn.client_ip)
    use-server s1 if { req.cook(SHARD) -m str s1 }
    use-server s2 if { req.cook(SHARD) -m str s2 }
    # use-server s3 if { req.cook(SHARD) -m str s3 }
    default-server inter 3s fall 3 rise 2
    server s1 10.20.0.11:80 check
    server s2 10.20.0.21:80 check
    # server s3 10.20.0.31:80 check

# colibri-ws: `/colibri-ws/<bridgeId>/…`. Each shard's JVB advertises a
# shard-unique id (COLIBRI_WEBSOCKET_REGEX / JVB_WS_SERVER_ID = the shard name),
# so route on the id in path segment 2.
backend jitsi_colibri
    balance roundrobin
    use-server s1 if { path,field(3,/) -i -m str s1 }
    use-server s2 if { path,field(3,/) -i -m str s2 }
    # use-server s3 if { path,field(3,/) -i -m str s3 }
    server s1 10.20.0.11:80 check
    server s2 10.20.0.21:80 check
    # server s3 10.20.0.31:80 check

# `/jamulus-audio`: every shard's jamulus-relay bridges to the SAME Jamulus on
# the AMD, so any shard is fine.
backend jamulus_relays
    balance roundrobin
    server s1 10.20.0.11:80 check
    server s2 10.20.0.21:80 check
    # server s3 10.20.0.31:80 check

# Runtime API for `make deploy-edge` health gating and `hash-type consistent`
# node-state. Bound to loopback; the compose file publishes it to the host only.
frontend fe_stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
    stats refresh 10s
