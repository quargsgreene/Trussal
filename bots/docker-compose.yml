# Trussal bots deployment.
#
# Only the conductor is a compose service: bot containers are created and
# destroyed dynamically by the conductor through the docker socket (the
# replace/scale-down policies need per-bot lifecycle control that a static
# compose service list can't express). The `bot-image` service exists solely
# so `docker compose build` produces the trussal-bot image the conductor
# launches; it never runs.
#
# Networking: bot containers run with --network host (set in the conductor's
# docker runner), because the spec pins the Jitsi room to http://localhost/0
# — inside a bridge-networked container "localhost" would be the container
# itself, not the VM where Jitsi listens. Consequently bots reach the
# conductor at localhost:7700, which is why 7700 is published below.
#
# Host prerequisites (once per boot):
#   sudo modprobe snd-aloop enable=1,1 index=10,11 pcm_substreams=8,8
# Two loopback cards × 8 substreams cover 10 bots; each bot claims its own
# subdevice (hw:Loopback,0,BOT_ID%8), generated in the entrypoint.

services:
  conductor:
    build:
      # Repo root, not bots/, for the same reason as bot-image below: the fleet
      # service imports the shared botConfig rule from src/, which a bots/-scoped
      # context can't reach.
      context: ..
      dockerfile: bots/docker/Dockerfile.conductor
    container_name: trussal-conductor
    ports:
      - "7777:7777"   # admin page — reachable from outside the VM (spec)
      - "7700:7700"   # assignments/metrics — bots are host-networked, so they connect via localhost:7700
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MAX_BOTS: "10"
      SESSION_SEED: "1"
      CONDUCTOR_URL: "http://localhost:7700"
      # Your Jitsi instance. Only the HOST part matters: the fleet rewrites the
      # room segment per meeting (jitsiUrlForRoom), so bots join whichever room
      # their humans are in — the "/0" here is just a template. Bandwidth guards
      # keep 10 bots gentle on a self-hosted bridge (see README "Home-network load").
      JITSI_URL: "${JITSI_URL:-http://localhost/0}"
      JAMULUS_SERVER: "${JAMULUS_SERVER:-trussal.duckdns.org:22000}"
      # When true, each bot renders its own Hydra visual instead of the shared
      # master. Also toggleable at runtime from the admin page.
      VARY_HYDRA: "${VARY_HYDRA:-false}"
      # Fleet service: the peer-state bus the conductor joins to discover rooms
      # and receive Spawn requests. It serves EVERY room people open (discovered
      # over the relay's control channel), so there is no room to configure. The
      # sidecar runs on the VIDEO VM, so the localhost default is wrong on this
      # VM — set SIDECAR_WS_URL in .env to the sidecar's reachable URL
      # (wss://<jitsi-host>/ws). Without it the fleet sees no rooms at all: no
      # aggregator appears and the Spawn button broadcasts into the void.
      SIDECAR_WS_URL: "${SIDECAR_WS_URL:-ws://localhost:8081/ws}"
      # Must match SIDECAR_CONTROL_TOKEN on the video VM's `latency` service.
      # The relay refuses room discovery without it (the channel lists every
      # live meeting on a publicly-proxied path), so leaving it unset means no
      # rooms are served and no aggregator ever spawns.
      FLEET_CONTROL_TOKEN: "${FLEET_CONTROL_TOKEN:-}"
      # No room setting exists: the fleet serves every room it discovers and
      # points each container at its own meeting through JITSI_URL.
    # The conductor is bridge-networked. Home LANs often can't hairpin the public
    # Jitsi hostname, and the sidecar's TLS cert is for that name (not the LAN
    # IP), so alias the hostname to the video VM's LAN IP: the fleet then reaches
    # the sidecar by name over the LAN (no hairpin) with a valid cert. Set
    # SIDECAR_HOST_ALIAS=<jitsi-host>:<video-vm-lan-ip> in .env; default no-ops.
    extra_hosts:
      - "${SIDECAR_HOST_ALIAS:-sidecar.invalid:127.0.0.1}"
    restart: unless-stopped
    # On SIGTERM (a redeploy's --force-recreate, or `compose stop`) the conductor
    # runs fleet.stop(), which gracefully stops every bot + the aggregator so they
    # leave the Jitsi room cleanly (no ghost sessions -> meetings actually end).
    # That teardown must finish before Docker SIGKILLs the conductor: bots are
    # stopped in parallel (~15s each), so give a wide margin.
    stop_grace_period: 90s

  bot-image:
    build:
      # Repo root, not bots/: the bot imports shared repo trees (src/audio-net,
      # latency-instrument, public/lib) that must be in the build context. The
      # root .dockerignore whitelists exactly what the Dockerfile copies.
      context: ..
      dockerfile: bots/docker/Dockerfile.bot
    image: trussal-bot
    profiles: [build-only]   # never started by compose; conductor runs these
