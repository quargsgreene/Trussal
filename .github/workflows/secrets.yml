name: secrets
on: [push, pull_request]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history, so re-introduction is caught too
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1

  forbidden-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bad=$(git ls-files | grep -E '^custom-config/(web/acme\.sh/|jicofo/jicofo\.conf$|jvb/jvb\.conf$)' || true)
          [ -z "$bad" ] || { echo "Tracked container-written config:"; echo "$bad"; exit 1; }
