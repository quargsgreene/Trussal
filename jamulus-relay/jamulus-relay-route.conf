location = /jamulus-audio {
    tcp_nodelay on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Variable upstream forces request-time DNS via Docker resolver so nginx
    # still starts when the relay container isn't up yet.
    set $jamulus_relay_upstream "jamulus-relay:8082";
    proxy_pass http://$jamulus_relay_upstream;

    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
}
